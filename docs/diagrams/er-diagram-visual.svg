<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 740" width="1020" height="740" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="1020" height="740" fill="url(#grid)" />

  <!-- Title Badge -->
  <rect x="260" y="18" width="500" height="42" rx="8" fill="#1e293b" filter="url(#shadow)"/>
  <text x="510" y="44" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="1.5" text-anchor="middle">GOVERNMENT GRIEVANCE PORTAL — ER DIAGRAM</text>

  <!-- ==================== RELATIONSHIP CONNECTORS ==================== -->
  <!-- 1. Department to User (GRO employs) -->
  <path d="M 260 175 L 390 175" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="165" fill="#1e293b" font-size="11" font-weight="600">1</text>
  <text x="375" y="165" fill="#1e293b" font-size="11" font-weight="600">N</text>
  <text x="325" y="190" fill="#64748b" font-size="10" text-anchor="middle" font-style="italic">employs (GRO)</text>

  <!-- 2. Department to Grievance (handles) -->
  <path d="M 145 270 L 145 465 L 375 465" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="155" y="295" fill="#1e293b" font-size="11" font-weight="600">1</text>
  <text x="360" y="455" fill="#1e293b" font-size="11" font-weight="600">N</text>
  <text x="205" y="455" fill="#64748b" font-size="10" text-anchor="middle" font-style="italic">handles</text>

  <!-- 3. User to Grievance (files as Citizen) -->
  <path d="M 505 310 L 505 385" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="330" fill="#1e293b" font-size="11" font-weight="600">1</text>
  <text x="515" y="375" fill="#1e293b" font-size="11" font-weight="600">N</text>
  <text x="550" y="350" fill="#64748b" font-size="10" text-anchor="middle" font-style="italic">files</text>

  <!-- 4. Grievance to ResolutionLog (audit trail) -->
  <path d="M 385 520 L 275 520" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="365" y="510" fill="#1e293b" font-size="11" font-weight="600">1</text>
  <text x="290" y="510" fill="#1e293b" font-size="11" font-weight="600">N</text>
  <text x="330" y="538" fill="#64748b" font-size="10" text-anchor="middle" font-style="italic">tracks</text>

  <!-- 5. User (GRO) to ResolutionLog (writes) -->
  <path d="M 400 240 L 330 240 L 330 380 L 230 380 L 230 420" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="380" y="230" fill="#1e293b" font-size="11" font-weight="600">1</text>
  <text x="240" y="415" fill="#1e293b" font-size="11" font-weight="600">N</text>
  <text x="300" y="365" fill="#64748b" font-size="10" text-anchor="middle" font-style="italic">writes (GRO)</text>

  <!-- 6. Grievance to Feedback (receives) -->
  <path d="M 645 520 L 740 520" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="510" fill="#1e293b" font-size="11" font-weight="600">1</text>
  <text x="725" y="510" fill="#1e293b" font-size="11" font-weight="600">1</text>
  <text x="695" y="538" fill="#64748b" font-size="10" text-anchor="middle" font-style="italic">receives</text>


  <!-- ==================== ENTITY TABLES ==================== -->

  <!-- TABLE 1: DEPARTMENT -->
  <g filter="url(#shadow)">
    <rect x="35" y="95" width="225" height="175" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 35 101 A 6 6 0 0 1 41 95 L 254 95 A 6 6 0 0 1 260 101 L 260 128 L 35 128 Z" fill="#1e3a8a"/>
    <text x="147" y="118" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">DEPARTMENT</text>
    
    <text x="48" y="148" fill="#dc2626" font-size="11" font-weight="bold">id</text>
    <text x="95" y="148" fill="#64748b" font-size="10">(PK)</text>
    <text x="135" y="148" fill="#334155" font-size="11">BIGINT AUTO_INC</text>

    <text x="48" y="172" fill="#0284c7" font-size="11" font-weight="bold">name</text>
    <text x="95" y="172" fill="#64748b" font-size="10">(UQ)</text>
    <text x="135" y="172" fill="#334155" font-size="11">VARCHAR(100)</text>

    <text x="48" y="196" fill="#0284c7" font-size="11" font-weight="bold">code</text>
    <text x="95" y="196" fill="#64748b" font-size="10">(UQ)</text>
    <text x="135" y="196" fill="#334155" font-size="11">VARCHAR(20)</text>

    <text x="48" y="220" fill="#334155" font-size="11">description</text>
    <text x="135" y="220" fill="#334155" font-size="11">VARCHAR(255)</text>

    <text x="48" y="244" fill="#334155" font-size="11">created_at</text>
    <text x="135" y="244" fill="#334155" font-size="11">DATETIME</text>
  </g>

  <!-- TABLE 2: USER -->
  <g filter="url(#shadow)">
    <rect x="390" y="80" width="245" height="230" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 390 86 A 6 6 0 0 1 396 80 L 629 80 A 6 6 0 0 1 635 86 L 635 113 L 390 113 Z" fill="#0f766e"/>
    <text x="512" y="103" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">USER</text>

    <text x="403" y="133" fill="#dc2626" font-size="11" font-weight="bold">id</text>
    <text x="475" y="133" fill="#64748b" font-size="10">(PK)</text>
    <text x="515" y="133" fill="#334155" font-size="11">BIGINT AUTO_INC</text>

    <text x="403" y="156" fill="#334155" font-size="11">name</text>
    <text x="515" y="156" fill="#334155" font-size="11">VARCHAR(100)</text>

    <text x="403" y="179" fill="#0284c7" font-size="11" font-weight="bold">email</text>
    <text x="475" y="179" fill="#64748b" font-size="10">(UQ)</text>
    <text x="515" y="179" fill="#334155" font-size="11">VARCHAR(150)</text>

    <text x="403" y="202" fill="#334155" font-size="11">password</text>
    <text x="515" y="202" fill="#334155" font-size="11">VARCHAR(255)</text>

    <text x="403" y="225" fill="#334155" font-size="11">phone_number</text>
    <text x="515" y="225" fill="#334155" font-size="11">VARCHAR(20)</text>

    <text x="403" y="248" fill="#334155" font-size="11">role</text>
    <text x="515" y="248" fill="#334155" font-size="11">VARCHAR(20)</text>

    <text x="403" y="271" fill="#7c3aed" font-size="11" font-weight="bold">department_id</text>
    <text x="475" y="271" fill="#64748b" font-size="10">(FK)</text>
    <text x="515" y="271" fill="#334155" font-size="11">BIGINT (NULLABLE)</text>

    <text x="403" y="294" fill="#334155" font-size="11">created_at</text>
    <text x="515" y="294" fill="#334155" font-size="11">DATETIME</text>
  </g>

  <!-- TABLE 3: GRIEVANCE -->
  <g filter="url(#shadow)">
    <rect x="385" y="385" width="260" height="260" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 385 391 A 6 6 0 0 1 391 385 L 639 385 A 6 6 0 0 1 645 391 L 645 418 L 385 418 Z" fill="#b45309"/>
    <text x="515" y="408" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">GRIEVANCE</text>

    <text x="398" y="438" fill="#dc2626" font-size="11" font-weight="bold">id</text>
    <text x="480" y="438" fill="#64748b" font-size="10">(PK)</text>
    <text x="520" y="438" fill="#334155" font-size="11">BIGINT AUTO_INC</text>

    <text x="398" y="461" fill="#0284c7" font-size="11" font-weight="bold">tracking_id</text>
    <text x="480" y="461" fill="#64748b" font-size="10">(UQ)</text>
    <text x="520" y="461" fill="#334155" font-size="11">VARCHAR(50)</text>

    <text x="398" y="484" fill="#334155" font-size="11">subject</text>
    <text x="520" y="484" fill="#334155" font-size="11">VARCHAR(200)</text>

    <text x="398" y="507" fill="#334155" font-size="11">description</text>
    <text x="520" y="507" fill="#334155" font-size="11">TEXT</text>

    <text x="398" y="530" fill="#334155" font-size="11">status</text>
    <text x="520" y="530" fill="#334155" font-size="11">VARCHAR(30)</text>

    <text x="398" y="553" fill="#334155" font-size="11">priority</text>
    <text x="520" y="553" fill="#334155" font-size="11">VARCHAR(20)</text>

    <text x="398" y="576" fill="#7c3aed" font-size="11" font-weight="bold">citizen_id</text>
    <text x="480" y="576" fill="#64748b" font-size="10">(FK)</text>
    <text x="520" y="576" fill="#334155" font-size="11">BIGINT (User)</text>

    <text x="398" y="599" fill="#7c3aed" font-size="11" font-weight="bold">department_id</text>
    <text x="480" y="599" fill="#64748b" font-size="10">(FK)</text>
    <text x="520" y="599" fill="#334155" font-size="11">BIGINT (Dept)</text>

    <text x="398" y="622" fill="#334155" font-size="11">created_at</text>
    <text x="520" y="622" fill="#334155" font-size="11">DATETIME</text>
  </g>

  <!-- TABLE 4: RESOLUTION_LOG -->
  <g filter="url(#shadow)">
    <rect x="25" y="420" width="250" height="200" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 25 426 A 6 6 0 0 1 31 420 L 269 420 A 6 6 0 0 1 275 426 L 275 453 L 25 453 Z" fill="#6d28d9"/>
    <text x="150" y="443" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">RESOLUTION_LOG</text>

    <text x="38" y="473" fill="#dc2626" font-size="11" font-weight="bold">id</text>
    <text x="120" y="473" fill="#64748b" font-size="10">(PK)</text>
    <text x="155" y="473" fill="#334155" font-size="11">BIGINT AUTO_INC</text>

    <text x="38" y="496" fill="#7c3aed" font-size="11" font-weight="bold">grievance_id</text>
    <text x="120" y="496" fill="#64748b" font-size="10">(FK)</text>
    <text x="155" y="496" fill="#334155" font-size="11">BIGINT</text>

    <text x="38" y="519" fill="#7c3aed" font-size="11" font-weight="bold">gro_id</text>
    <text x="120" y="519" fill="#64748b" font-size="10">(FK)</text>
    <text x="155" y="519" fill="#334155" font-size="11">BIGINT (User)</text>

    <text x="38" y="542" fill="#334155" font-size="11">action_taken</text>
    <text x="155" y="542" fill="#334155" font-size="11">VARCHAR(255)</text>

    <text x="38" y="565" fill="#334155" font-size="11">remarks</text>
    <text x="155" y="565" fill="#334155" font-size="11">TEXT</text>

    <text x="38" y="588" fill="#334155" font-size="11">logged_at</text>
    <text x="155" y="588" fill="#334155" font-size="11">DATETIME</text>
  </g>

  <!-- TABLE 5: FEEDBACK -->
  <g filter="url(#shadow)">
    <rect x="740" y="420" width="245" height="200" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 740 426 A 6 6 0 0 1 746 420 L 979 420 A 6 6 0 0 1 985 426 L 985 453 L 740 453 Z" fill="#be185d"/>
    <text x="862" y="443" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">FEEDBACK</text>

    <text x="753" y="473" fill="#dc2626" font-size="11" font-weight="bold">id</text>
    <text x="835" y="473" fill="#64748b" font-size="10">(PK)</text>
    <text x="870" y="473" fill="#334155" font-size="11">BIGINT AUTO_INC</text>

    <text x="753" y="496" fill="#7c3aed" font-size="11" font-weight="bold">grievance_id</text>
    <text x="835" y="496" fill="#64748b" font-size="10">(FK, UQ)</text>
    <text x="870" y="496" fill="#334155" font-size="11">BIGINT</text>

    <text x="753" y="519" fill="#334155" font-size="11">rating</text>
    <text x="870" y="519" fill="#334155" font-size="11">INT (1-5)</text>

    <text x="753" y="542" fill="#334155" font-size="11">comment</text>
    <text x="870" y="542" fill="#334155" font-size="11">TEXT</text>

    <text x="753" y="565" fill="#334155" font-size="11">is_appealed</text>
    <text x="870" y="565" fill="#334155" font-size="11">BOOLEAN</text>

    <text x="753" y="588" fill="#334155" font-size="11">submitted_at</text>
    <text x="870" y="588" fill="#334155" font-size="11">DATETIME</text>
  </g>

  <!-- Key Legend Footer -->
  <g transform="translate(680, 100)">
    <rect x="0" y="0" width="290" height="95" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="15" y="20" fill="#0f172a" font-size="11" font-weight="700">Schema Key Legend</text>
    <circle cx="22" cy="40" r="4" fill="#dc2626"/>
    <text x="35" y="43" fill="#334155" font-size="10"><tspan font-weight="600">PK</tspan> : Primary Key (Auto Increment)</text>
    <circle cx="22" cy="60" r="4" fill="#7c3aed"/>
    <text x="35" y="63" fill="#334155" font-size="10"><tspan font-weight="600">FK</tspan> : Foreign Key (Referential Integrity)</text>
    <circle cx="22" cy="80" r="4" fill="#0284c7"/>
    <text x="35" y="83" fill="#334155" font-size="10"><tspan font-weight="600">UQ</tspan> : Unique Constraint</text>
  </g>

</svg>
