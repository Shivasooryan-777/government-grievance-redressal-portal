server:
  port: 8080

spring:
  datasource:
    # Reads from environment variables. Falls back to local defaults if not set.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grievance_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-very-long-and-secure-random-string-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours